<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Lunarion share artwork</title>
    <link rel="stylesheet" href="/site.css?v=lunarion-blue-20260930" />
    <style>
      body { width: 1200px; height: 630px; overflow: hidden; }
      .share-card { display: grid; grid-template-columns: 51% 49%; width: 1200px; height: 630px; background: var(--yellow); }
      .share-copy { display: flex; flex-direction: column; padding: 40px 48px 32px; }
      .share-brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 40px; }
      .share-brand img { width: 40px; height: 40px; }
      .share-kicker { margin-top: 26px; font-size: 12px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; }
      .share-copy h1 { margin-top: 20px; font-size: 110px; line-height: .95; letter-spacing: -.035em; }
      .share-copy h1 span { display: block; }
      .share-copy h1 em { font-style: italic; }
      .share-description { margin-top: 22px; font-size: 16px; line-height: 1.5; }
      .share-address { margin-top: auto; padding-top: 12px; border-top: 1px solid #6b8fc9; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; }
      .share-art { position: relative; overflow: hidden; border-left: 1px solid var(--ink); }
      .share-art img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    </style>
  </head>
  <body>
    <main class="share-card" aria-label="Lunarion share image">
      <div class="share-copy">
        <div class="share-brand"><img src="/assets/lunarion-mark.svg" alt="" /><span>Lunarion</span></div>
        <p class="share-kicker">Student / Developer / Independently curious</p>
        <h1><span>Hello,</span><span><em>curious</em></span><span>world.</span></h1>
        <p class="share-description">Code, character, and a little curiosity.</p>
        <p class="share-address">LUNARION31.DEV</p>
      </div>
      <div class="share-art"><img src="/assets/lunar-orbit.svg" alt="An illustrated moon surrounded by orbital lines." /></div>
    </main>
  </body>
</html>
