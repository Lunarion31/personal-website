<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumi animation preview</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f2e8;color:#5c1933;font:15px system-ui}main{text-align:center;padding:40px}h1{font-size:22px;font-weight:500}p{color:#747267}.stage{height:190px;display:grid;place-items:center}.lumi{position:relative;width:88px;height:31px;overflow:hidden;isolation:isolate}.large{transform:scale(4);image-rendering:pixelated}.lumi img{width:88px;height:31px;display:block;image-rendering:pixelated}.actual{display:flex;justify-content:center;margin:24px}.paused *{animation-play-state:paused!important}button{font:inherit;border:1px solid #d9d3c4;background:#eee0e4;color:#5c1933;border-radius:5px;padding:8px 14px;cursor:pointer}
.monitor{position:absolute;left:10px;top:6px;width:13px;height:12px;overflow:hidden;pointer-events:none}
.activity{position:absolute;left:2px;top:2px;width:3px;height:1px;background:#a0e2e6;opacity:.65;box-shadow:0 3px #8cc8d3,4px 3px #8cc8d3;animation:activity 4.8s steps(1,end) infinite}
.scanline{position:absolute;left:0;top:-1px;width:100%;height:1px;background:#d0ffff;opacity:.28;animation:scan 4s steps(13,end) infinite}
.glitch{position:absolute;inset:0;background:#b9f7fa;opacity:0;animation:glitch-flash 8s steps(1,end) infinite}
.monitor{animation:glitch-shift 8s steps(1,end) infinite}
@keyframes scan{0%{transform:translateY(0)}75%,100%{transform:translateY(13px)}}
@keyframes activity{0%,100%{width:3px;box-shadow:0 3px #8cc8d3,4px 3px #8cc8d3}25%{width:6px;box-shadow:0 3px #8cc8d3,0 6px #a0e2e6}50%{width:4px;box-shadow:0 3px #8cc8d3,5px 3px #8cc8d3,0 6px #a0e2e6}75%{width:7px;box-shadow:0 3px #8cc8d3}}
@keyframes glitch-shift{0%,71%,73%,100%{transform:translateX(0)}70%,72%{transform:translateX(1px)}}
@keyframes glitch-flash{0%,71%,73%,100%{opacity:0}70%{opacity:.18}72%{opacity:.08}}
@media(prefers-reduced-motion:reduce){.lumi *{animation:none!important}.scanline,.glitch{display:none}}

.lumi{overflow:visible}
.still-letters{position:absolute;inset:0;clip-path:inset(0 0 0 31px)}
.rocking-computer{position:absolute;left:0;top:0;width:31px;height:31px;overflow:hidden;transform-origin:50% 85%;animation:computer-rock 2.4s ease-in-out infinite}
@keyframes computer-rock{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){.rocking-computer{animation:none!important}}

.computer-scene{position:absolute;left:0;top:0;width:31px;height:31px;perspective:110px}
.rocking-computer{position:absolute;inset:0;width:31px;height:31px;overflow:visible;transform-origin:50% 50%;transform-style:preserve-3d;animation:computer-turn 6s linear infinite}
.computer-front{position:absolute;inset:0;overflow:hidden;transform:translateZ(6px);backface-visibility:hidden}
.computer-back{position:absolute;left:3px;top:3px;width:25px;height:25px;background:repeating-linear-gradient(0deg,#777c76 0 1px,#a5aaa1 1px 3px);border:3px solid #a9ada5;border-bottom:5px solid #8f968c;transform:rotateY(180deg) translateZ(6px);backface-visibility:hidden}
.computer-side{position:absolute;top:3px;left:9.5px;width:12px;height:25px;background:linear-gradient(#b4b8ae 0 70%,#818b83 70% 83%,#a1a99e 83%);border:1px solid #77837b;backface-visibility:hidden}
.side-left{transform:rotateY(-90deg) translateZ(12.5px)}
.side-right{transform:rotateY(90deg) translateZ(12.5px)}
.computer-top{position:absolute;left:3px;top:-3px;width:25px;height:12px;background:#c1c6b9;transform:rotateX(90deg);backface-visibility:hidden}
@keyframes computer-turn{0%,12%{transform:rotateY(0)}88%,100%{transform:rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.rocking-computer{animation:none!important;transform:rotateY(-25deg)}}
